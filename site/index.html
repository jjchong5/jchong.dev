<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jonathan Chong</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 560px;
    margin: 4rem auto;
    padding: 0 1.5rem;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #111; }
    a { color: #7ab8ff; }
    .card { border-color: #333 !important; }
  }
  h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
  .tagline { color: #666; margin-top: 0; }
  @media (prefers-color-scheme: dark) { .tagline { color: #999; } }
  .links { margin-top: 2.5rem; display: grid; gap: 0.75rem; }
  .card {
    display: block;
    padding: 1rem 1.25rem;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: #999; }
  .card strong { display: block; font-size: 1.05rem; }
  .card span { font-size: 0.9rem; color: #666; }
  @media (prefers-color-scheme: dark) { .card span { color: #999; } }
  footer { margin-top: 3rem; font-size: 0.9rem; color: #666; }
  @media (prefers-color-scheme: dark) { footer { color: #999; } }
</style>
</head>
<body>
  <h1>Jonathan Chong</h1>
  <p class="tagline">jchong.dev</p>

  <div class="links">
    <a class="card" href="https://calendar.jchong.dev/">
      <strong>QuickCal</strong>
      <span>A faster way to view calendar &amp; Bay Area events</span>
    </a>
    <a class="card" href="https://jjchong5.github.io/">
      <strong>Portfolio</strong>
      <span>AI/ML Engineer &amp; Data Scientist — projects &amp; background</span>
    </a>
  </div>

  <footer>&copy; 2026 Jonathan Chong</footer>
</body>
</html>
